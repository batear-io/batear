name: ESP-IDF Build CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build ${{ matrix.role }}
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.0
    strategy:
      matrix:
        include:
          - role: detector_v3
            sdkconfig_extra: sdkconfig.detector_v3
            flash_size: 8MB
          - role: detector_v4
            sdkconfig_extra: sdkconfig.detector_v4
            flash_size: 16MB
          - role: gateway_v3
            sdkconfig_extra: sdkconfig.gateway_v3
            flash_size: 8MB
          - role: gateway_v4
            sdkconfig_extra: sdkconfig.gateway_v4
            flash_size: 16MB
          - role: wired_detector
            sdkconfig_extra: sdkconfig.wired_detector
            flash_size: 16MB
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fix Git Directory Permissions
        run: git config --global --add safe.directory /__w/batear/batear

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          rm -rf build sdkconfig
          env SDKCONFIG_DEFAULTS="sdkconfig.defaults;${{ matrix.sdkconfig_extra }}" idf.py set-target esp32s3
          idf.py build

      - name: Capture size
        run: |
          . $IDF_PATH/export.sh
          idf.py size 2>&1 | grep -E "^Total " > size_${{ matrix.role }}.txt

      - name: Merge binary
        run: |
          . $IDF_PATH/export.sh
          esptool.py --chip esp32s3 merge_bin -o merged_${{ matrix.role }}.bin \
            --flash_mode dio --flash_size ${{ matrix.flash_size }} \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/batear.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.role }}
          path: |
            merged_${{ matrix.role }}.bin
            size_${{ matrix.role }}.txt

  size-report:
    name: Firmware Size Report
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true

      - name: Generate size report
        id: size_report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROLES="detector_v3 detector_v4 gateway_v3 gateway_v4 wired_detector"
          REPO="${{ github.repository }}"
          R=/tmp/size_report.md
          sign() { local v=$1; [ "$v" -gt 0 ] && echo "+${v}" || echo "${v}"; }

          echo "## Firmware Size Report" > "$R"
          echo "" >> "$R"
          echo "| Role | Current | Previous | Delta |" >> "$R"
          echo "|------|--------:|---------:|------:|" >> "$R"
          for role in $ROLES; do
            # A missing artifact means the build job dropped a binary — fail loudly.
            CUR=$(stat -c %s "merged_${role}.bin")
            if curl -sfL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                 "https://github.com/${REPO}/releases/download/firmware-latest/merged_${role}.bin" \
                 -o "/tmp/prev_${role}.bin"; then
              PREV=$(stat -c %s "/tmp/prev_${role}.bin")
              echo "| ${role} | ${CUR} B | ${PREV} B | $(sign $((CUR - PREV))) B |" >> "$R"
            else
              echo "| ${role} | ${CUR} B | — | new |" >> "$R"
            fi
          done
          echo "" >> "$R"
          echo "> Compared against [\`firmware-latest\`](https://github.com/${REPO}/releases/tag/firmware-latest)." >> "$R"
          echo "" >> "$R"
          echo "<details><summary>idf.py size details</summary>" >> "$R"
          echo "" >> "$R"
          for role in $ROLES; do
            echo "**${role}:** \`$(cat size_${role}.txt)\`" >> "$R"
          done
          echo "" >> "$R"
          echo "</details>" >> "$R"
          # Hand the report and PR number off to the pr-size-comment workflow,
          # which runs in the base-repo context and can comment on fork PRs
          # (the fork-PR GITHUB_TOKEN here is read-only and cannot post).
          cp "$R" size_report.md
          echo "${{ github.event.pull_request.number }}" > pr_number.txt

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: |
            size_report.md
            pr_number.txt

  release:
    name: Publish Firmware
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract tag annotation
        if: startsWith(github.ref, 'refs/tags/')
        id: tag_body
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          {
            echo "message<<ENDOFTAG"
            echo "$TAG_MSG"
            echo "ENDOFTAG"
          } >> "$GITHUB_OUTPUT"

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'firmware-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Firmware' }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          body: ${{ startsWith(github.ref, 'refs/tags/') && steps.tag_body.outputs.message || 'Pre-built firmware binaries. Flash via the [Web Flasher](https://docs.batear.io/flasher/).' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            merged_detector_v3.bin
            merged_detector_v4.bin
            merged_gateway_v3.bin
            merged_gateway_v4.bin
            merged_wired_detector.bin
