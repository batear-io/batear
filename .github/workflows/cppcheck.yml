name: Static Analysis (Cppcheck)

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CPPCHECK_VERSION: 2.13.0

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache Cppcheck
        id: cache-cppcheck
        uses: actions/cache@v4
        with:
          path: ~/cppcheck
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-${{ runner.os }}

      - name: Build Cppcheck
        if: steps.cache-cppcheck.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$CPPCHECK_VERSION" https://github.com/danmar/cppcheck /tmp/cppcheck-src
          cmake -S /tmp/cppcheck-src -B /tmp/cppcheck-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck" -DFILESDIR="$HOME/cppcheck/share/cppcheck"
          cmake --build /tmp/cppcheck-build -j"$(nproc)"
          cmake --install /tmp/cppcheck-build

      - name: Add Cppcheck to PATH
        run: |
          echo "$HOME/cppcheck/bin" >> "$GITHUB_PATH"
          "$HOME/cppcheck/bin/cppcheck" --version

      - name: Run Cppcheck
        run: |
          cppcheck --enable=all --inline-suppr --error-exitcode=1 \
          --suppress=missingInclude --suppress=missingIncludeSystem \
          --suppress=checkersReport \
          --std=c99 --platform=unix64 \
          main/
