name: Host Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: mesh.c
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Imain test/host/test_mesh.c main/mesh.c -o test_mesh
          ./test_mesh
